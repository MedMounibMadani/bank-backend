services:
  bankapp:
    build: .
    container_name: bank-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3308/bank?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    depends_on:
      - db
    networks:
      - bank
  db:
    image: mysql:8.0
    container_name: mysqldb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank
      MYSQL_USER: mounib
      MYSQL_PASSWORD: Mounib@123
    ports:
      - '3308:3308'
    expose:
      - '3308'
    command: [ 'mysqld', '--port=3308', '--default-authentication-plugin=mysql_native_password' ]
    networks:
      - bank
    volumes:
      - mysqldb_data:/var/lib/mysql
volumes:
  mysqldb_data:
networks:
  bank: